# Formulário FNRH público: segurança por guest_id (fnrh_hospedes.id) + link_token no corpo/query — sem sessão Supabase.
[functions.fnrh-get]
verify_jwt = false

[functions.fnrh-submit]
verify_jwt = false

[functions.internal-users-admin]
verify_jwt = false

[functions.yes-hotel-lifecycle]
verify_jwt = false

[functions.fnrh-auto-reenvio]
verify_jwt = false

[functions.senha-auto-envio]
verify_jwt = false

[functions.send-fnrh-links]
verify_jwt = false

[functions.send-senha]
verify_jwt = false

[functions.send-whatsapp-message]
verify_jwt = false

[functions.operacional-comunicacao-dispatch]
verify_jwt = false

# Pull PMS (Hospedin): service_role + opcional x-hospedin-sync-secret (ver docs).
[functions.pms-hospedin-sync]
verify_jwt = false

# TTLock Lock Records Notify (PR3).
# verify_jwt=false SOMENTE nesta Edge pública de callback (não altera outras).
# Auth da aplicação: TTLOCK_ACCESS_WEBHOOK_SECRET (header preferencial; query=fallback).
# Com flag desligada: ack "success" sem revelar validade do segredo e sem persistir.
# NÃO configurar Callback URL na TTLock até homologação autorizada.
[functions.ttlock-access-ingest]
verify_jwt = false

# Processador de tolerância / outbox.
# verify_jwt=false: autenticação própria (service_role Bearer OU x-access-tolerance-token),
# alinhado a senha-auto-envio / fnrh-auto-reenvio para cron pg_net sem JWT gateway.
[functions.access-tolerance-processor]
verify_jwt = false

# Pagar.me webhook (Checkpoint 2) — NOTIFICAÇÃO apenas; confirmação = GET server-to-server.
# verify_jwt=false SOMENTE nesta Edge pública de callback.
# NÃO configurar webhook real / NÃO deployar em produção neste checkpoint.
# Admin (cobranca-pagarme-admin) mantém JWT obrigatório (default verify_jwt=true).
[functions.cobranca-pagarme-webhook]
verify_jwt = false

# Envio multicanal do Payment Link ao hóspede (não cria cobrança).
[functions.send-payment-link]
verify_jwt = false

# Diagnóstico read-only lockRecord/list (token scheduler / service_role).
[functions.ttlock-lock-record-diagnose]
verify_jwt = false

# Polling TTLock lockRecord/list → first-room-access (fallback sem callback).
# Auth: service_role ou x-access-tolerance-token. Flag YES_HOTEL_TTLOCK_ACCESS_POLL_ENABLED.
[functions.ttlock-access-poller]
verify_jwt = false
