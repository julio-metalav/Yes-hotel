# Exemplo HOMO — NÃO aplicar automaticamente.
# HTTPS/Let's Encrypt já existem em hits-homo.yeshotel.com.br.
# Não executar Certbot. Preservar os caminhos ssl_certificate atuais.
#
# Fastify escuta só 127.0.0.1:3001 e confia em X-Forwarded-* apenas de 127.0.0.1/::1.
# X-Forwarded-For é sobrescrito com $remote_addr (o cliente não consegue spoofar via header).

server_tokens off;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hits-homo.yeshotel.com.br;

    # Certificados já gerenciados pelo Certbot neste host — não alterar.
    ssl_certificate     /etc/letsencrypt/live/hits-homo.yeshotel.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hits-homo.yeshotel.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32k;

    # Busca de hóspedes pode receber documento/e-mail na query string.
    # Não registrar a URL dessa rota no access log do Nginx.
    location = /v1/guests {
        access_log off;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_read_timeout 20s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_read_timeout 20s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name hits-homo.yeshotel.com.br;

    # Preservar renovação Let's Encrypt (não remover se o Certbot já inseriu um bloco equivalente).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
