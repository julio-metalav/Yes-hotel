<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FNRH — Yes Hotel (pré-preenchimento)</title>
  <style>
    :root {
      --yh-bg: #f4f7fb;
      --yh-surface: #ffffff;
      --yh-ink: #1a2332;
      --yh-muted: #5b677a;
      --yh-border: #d5dde8;
      --yh-primary: #1a5f9e;
      --yh-primary-press: #144a7a;
      --yh-secondary: #5c6b7a;
      --yh-ok: #0a7a4a;
      --yh-err: #b42318;
      --yh-banner: #e8f1fa;
      --yh-banner-border: #b7cfe6;
      --yh-progress: #1a5f9e;
      --yh-radius: 10px;
      --yh-shadow: 0 1px 2px rgba(26, 35, 50, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 1rem;
      padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(180deg, #e9eef5 0%, var(--yh-bg) 40%, #eef2f7 100%);
      color: var(--yh-ink);
      min-height: 100vh;
      line-height: 1.45;
    }
    #app { max-width: 560px; margin: 0 auto; }
    .v2-wrap, .legacy-wrap {
      background: var(--yh-surface);
      border: 1px solid var(--yh-border);
      border-radius: var(--yh-radius);
      padding: 1.1rem 1rem 1.25rem;
      box-shadow: var(--yh-shadow);
    }
    h1 { font-size: 1.35rem; margin: 0 0 0.25rem; font-weight: 700; letter-spacing: -0.02em; }
    h2 { font-size: 1.05rem; margin: 0 0 0.35rem; }
    .muted { color: var(--yh-muted); font-size: 0.9rem; }
    .meta-line { margin: 0.35rem 0 0.75rem; }
    .step-label { font-size: 0.88rem; color: var(--yh-muted); margin: 0.5rem 0 0.85rem; }
    .banner {
      background: var(--yh-banner);
      border: 1px solid var(--yh-banner-border);
      border-radius: 8px;
      padding: 0.7rem 0.85rem;
      margin-bottom: 1rem;
      font-size: 0.92rem;
    }
    .progress {
      height: 6px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 0.75rem;
    }
    .progress-bar {
      height: 100%;
      background: var(--yh-progress);
      border-radius: 99px;
      transition: width 0.25s ease;
    }
    label { display: block; margin-top: 0.85rem; font-weight: 600; font-size: 0.92rem; }
    input, textarea, select {
      width: 100%;
      padding: 0.7rem 0.75rem;
      margin-top: 0.3rem;
      border: 1px solid var(--yh-border);
      border-radius: 8px;
      font-size: 1rem;
      background: #fff;
      color: var(--yh-ink);
    }
    input:focus, textarea:focus, select:focus {
      outline: 2px solid rgba(26, 95, 158, 0.35);
      border-color: var(--yh-primary);
    }
    textarea { min-height: 72px; resize: vertical; }
    .btn, button {
      margin-top: 0.75rem;
      padding: 0.75rem 1.15rem;
      background: var(--yh-primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
    }
    .btn.primary { background: var(--yh-primary); }
    .btn.primary:active { background: var(--yh-primary-press); }
    .btn.secondary, button.secondary { background: var(--yh-secondary); }
    .btn.compact { margin-top: 0.3rem; padding: 0.65rem 0.85rem; white-space: nowrap; }
    button:disabled, .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .nav-row {
      display: flex;
      gap: 0.65rem;
      margin-top: 1.1rem;
      flex-wrap: wrap;
    }
    .nav-row .btn { flex: 1; min-width: 120px; margin-top: 0; }
    .draft-status { font-size: 0.85rem; margin-top: 0.65rem; min-height: 1.25rem; }
    .draft-status.is-ok { color: var(--yh-ok); }
    .draft-status.is-err { color: var(--yh-err); }
    .error { color: var(--yh-err); margin-top: 0.65rem; font-size: 0.92rem; }
    .success { color: var(--yh-ok); margin-top: 0.5rem; }
    .success-panel {
      background: #eef8f2;
      border: 1px solid #b7e0c6;
      border-radius: 8px;
      padding: 1rem;
    }
    .success-panel h2 { color: var(--yh-ok); }
    .analyzing {
      background: #fff8e8;
      border: 1px solid #e6d4a8;
      color: #6a5418;
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      margin-bottom: 0.85rem;
      font-weight: 600;
      font-size: 0.92rem;
    }
    .file-label {
      display: block;
      margin-top: 0.85rem;
      padding: 0.85rem;
      border: 1px dashed var(--yh-border);
      border-radius: 8px;
      background: #f8fafc;
      font-weight: 600;
    }
    .file-label input { margin-top: 0.5rem; padding: 0.35rem 0; border: none; background: transparent; }
    .sr-only-file {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .doc-cta-stack {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 0.35rem;
    }
    .doc-cta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.2rem;
      width: 100%;
      min-height: 72px;
      padding: 1rem 1.05rem;
      border-radius: 12px;
      border: 1px solid var(--yh-border);
      background: #fff;
      text-align: left;
      cursor: pointer;
      font: inherit;
      color: inherit;
    }
    .doc-cta--primary {
      background: linear-gradient(180deg, #1a5f9e 0%, #154f84 100%);
      border-color: #144a7a;
      color: #fff;
      min-height: 96px;
      box-shadow: 0 6px 16px rgba(26, 95, 158, 0.22);
    }
    .doc-cta--primary:active { background: var(--yh-primary-press); }
    .doc-cta--secondary {
      background: #f8fafc;
    }
    .doc-cta--secondary:active { background: #eef2f7; }
    .doc-cta__icon { font-size: 1.45rem; line-height: 1; }
    .doc-cta__title { font-size: 1.05rem; font-weight: 700; }
    .doc-cta__hint { font-size: 0.88rem; font-weight: 500; opacity: 0.88; }
    .doc-preview-card {
      margin: 0.85rem 0 1rem;
      padding: 0.85rem;
      border: 1px solid var(--yh-border);
      border-radius: 12px;
      background: #f8fafc;
    }
    .doc-preview-img {
      display: block;
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      border-radius: 8px;
      background: #fff;
      margin-bottom: 0.65rem;
    }
    .doc-preview-name {
      margin: 0.35rem 0 0;
      word-break: break-all;
    }
    .doc-retake-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.65rem;
    }
    .doc-confira-cta {
      width: 100%;
      margin-top: 1rem;
    }
    .ok-chip {
      display: inline-block;
      margin-top: 0.4rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--yh-ok);
      background: #e6f6ee;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
    }
    .cep-row { display: flex; gap: 0.5rem; align-items: flex-start; }
    .cep-row input { flex: 1; }
    .check-inline, .check-block {
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      font-weight: 500;
      margin-top: 0.85rem;
    }
    .check-inline input, .check-block input {
      width: auto;
      margin-top: 0.2rem;
      flex-shrink: 0;
    }
    .minor-card {
      border: 1px solid var(--yh-border);
      border-radius: 8px;
      padding: 0.85rem;
      margin-top: 0.85rem;
      background: #fafbfd;
    }
    .review { margin: 0; }
    .review dt {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--yh-muted);
      margin-top: 0.75rem;
    }
    .review dd { margin: 0.15rem 0 0; font-weight: 500; }
    .versions { margin-top: 1rem; font-size: 0.82rem; }
    .versions code {
      font-size: 0.78rem;
      background: #eef2f7;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
    }
    .tip { margin-top: 0.75rem; }
    #signatureCanvas {
      border: 1px solid var(--yh-border);
      border-radius: 4px;
      cursor: crosshair;
      touch-action: none;
      max-width: 100%;
      background: #fff;
      display: block;
      width: 100%;
    }
    .signature-label { margin-top: 1rem; }
    .actions-confirm { margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--yh-border); }
  </style>
</head>
<body>
  <div id="app">
    <p class="muted">Carregando...</p>
  </div>

  <script src="./yes-supabase-config.js"></script>
  <script src="./fnrh-checkin-v2.js"></script>
  <script>
    (function () {
      var DEBOUNCE_MS = 850;
      var config = typeof window.YES_HOTEL_SUPABASE_CONFIG !== "undefined" ? window.YES_HOTEL_SUPABASE_CONFIG : {};
      var supabaseUrl = (config.url || "").replace(/\/+$/, "");
      var functionsUrl = supabaseUrl ? supabaseUrl + "/functions/v1" : "";

      var params = new URLSearchParams(window.location.search);
      var guestId = params.get("guest_id") || params.get("guest-id");
      var token = params.get("token");
      var app = document.getElementById("app");

      function sessionKeyFor(gid) {
        return "yh_fnrh_token_v1_" + String(gid || "");
      }

      function stripTokenFromAddressBar() {
        try {
          var u = new URL(window.location.href);
          if (!u.searchParams.has("token")) return;
          u.searchParams.delete("token");
          var q = u.searchParams.toString();
          window.history.replaceState({}, "", u.pathname + (q ? "?" + q : "") + u.hash);
        } catch (_) {}
      }

      // Link legado traz ?token= uma vez → guarda em sessionStorage e remove da URL.
      if (guestId && token) {
        try {
          sessionStorage.setItem(sessionKeyFor(guestId), token);
        } catch (_) {}
        stripTokenFromAddressBar();
      } else if (guestId && !token) {
        try {
          token = sessionStorage.getItem(sessionKeyFor(guestId)) || "";
        } catch (_) {
          token = "";
        }
      }

      if (!guestId || !token) {
        app.innerHTML = "<p class=\"error\">Link inválido. São necessários guest_id (id da FNRH) e token na URL.</p>";
        return;
      }

      if (!functionsUrl) {
        app.innerHTML = "<p class=\"error\">Configuração do sistema não encontrada.</p>";
        return;
      }

      function fetchFnrhGet() {
        // POST body: token fora da query string (access log da Edge).
        return fetch(functionsUrl + "/fnrh-get", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ guest_id: guestId, token: token }),
        });
      }
      function getSubmitUrl() {
        return functionsUrl + "/fnrh-submit";
      }

      function escapeHtml(s) {
        var div = document.createElement("div");
        div.textContent = s == null ? "" : String(s);
        return div.innerHTML;
      }

      function formatTime(d) {
        return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      }

      fetchFnrhGet()
        .then(function (r) {
          if (r.status === 404) throw new Error("Link inválido ou expirado.");
          return r.json();
        })
        .then(function (data) {
          if (data.error) throw new Error(data.error);
          if (data.fechado) {
            app.innerHTML =
              '<div class="legacy-wrap"><h1>FNRH</h1><p class="success">' +
              escapeHtml(data.message || "Concluído.") +
              "</p></div>";
            return;
          }

          var flow = String(data.flow_version || "").toLowerCase();
          if (flow === "v2" && window.YesHotelFnrhCheckinV2 && typeof window.YesHotelFnrhCheckinV2.start === "function") {
            window.YesHotelFnrhCheckinV2.start({
              appEl: app,
              guestId: guestId,
              token: token,
              functionsUrl: functionsUrl,
              data: data,
            });
            return;
          }

          // flow_version=legacy (ou ausência de módulo v2): formulário com canvas
          renderLegacyForm(data);
        })
        .catch(function (err) {
          app.innerHTML =
            '<div class="legacy-wrap"><h1>FNRH</h1><p class="error">' +
            escapeHtml(err.message || "Erro ao carregar.") +
            "</p></div>";
        });

      function renderLegacyForm(data) {
        var pre = data.preenchido || {};
        var principal = !!data.principal;
        var meta = data.meta || {};
        var aptLine = meta.apartamento ? "Apartamento " + escapeHtml(meta.apartamento) + " · " : "";
        var lprBlock = "";
        if (principal) {
          lprBlock = [
            "  <label>Placa do veículo (opcional)</label><input name=\"placa_veiculo\" data-draft=\"1\" placeholder=\"Ex: ABC1D23\" value=\"" + escapeHtml(pre.placa_veiculo || "") + "\" />",
            "  <label>Cor do veículo (opcional)</label><input name=\"cor_veiculo\" data-draft=\"1\" placeholder=\"Ex: Prata\" value=\"" + escapeHtml(pre.cor_veiculo || "") + "\" />",
            "  <label>Modelo do veículo (opcional)</label><input name=\"modelo_veiculo\" data-draft=\"1\" placeholder=\"Ex: Fiat Uno\" value=\"" + escapeHtml(pre.modelo_veiculo || "") + "\" />"
          ].join("");
        } else {
          lprBlock = "  <label>Placa do veículo (se houver)</label><input name=\"placa_veiculo\" data-draft=\"1\" placeholder=\"Opcional\" value=\"" + escapeHtml(pre.placa_veiculo || "") + "\" />";
        }

        var statusHint = "";
        if (data.status === "rascunho") statusHint = " Você tem um rascunho salvo — continue de onde parou.";

        app.innerHTML = [
          '<div class="legacy-wrap">',
          "<h1>FNRH — Ficha de registro (Yes Hotel)</h1>",
          "<div class=\"banner\">Esta página é a <strong>etapa do hotel</strong> para reunir seus dados. Depois, o hotel poderá enviar à ficha oficial (MTur/SNRHos) quando integrado." + statusHint + "</div>",
          "<p class=\"muted\">" + aptLine + "Revise os dados já conhecidos pelo hotel, complete o que faltar e confirme ao final.</p>",
          "<form id=\"fnrh-form\">",
          "  <label>Nome completo *</label><input name=\"hospede_nome\" data-draft=\"1\" value=\"" + escapeHtml(pre.hospede_nome || "") + "\" />",
          "  <label>Documento (CPF/RG) *</label><input name=\"documento\" data-draft=\"1\" placeholder=\"CPF ou RG\" value=\"" + escapeHtml(pre.documento || "") + "\" />",
          "  <label>Data de nascimento</label><input name=\"data_nascimento\" data-draft=\"1\" type=\"date\" value=\"" + escapeHtml(pre.data_nascimento || "") + "\" />",
          "  <label>Nacionalidade *</label><input name=\"nacionalidade\" data-draft=\"1\" placeholder=\"ex: Brasileira\" value=\"" + escapeHtml(pre.nacionalidade || "") + "\" />",
          "  <label>Endereço completo *</label><textarea name=\"endereco\" data-draft=\"1\" placeholder=\"Rua, número, bairro, cidade, estado, CEP\">" + escapeHtml(pre.endereco || "") + "</textarea>",
          "  <label>Telefone *</label><input name=\"telefone\" data-draft=\"1\" type=\"tel\" placeholder=\"(00) 00000-0000\" value=\"" + escapeHtml(pre.telefone || "") + "\" />",
          "  <label>E-mail *</label><input name=\"email\" data-draft=\"1\" type=\"email\" value=\"" + escapeHtml(pre.email || "") + "\" />",
          "  <label>Procedência (cidade/país de onde vem) *</label><input name=\"procedencia\" data-draft=\"1\" value=\"" + escapeHtml(pre.procedencia || "") + "\" />",
          "  <label>Destino (para onde vai após) *</label><input name=\"destino\" data-draft=\"1\" value=\"" + escapeHtml(pre.destino || "") + "\" />",
          lprBlock,
          "  <div class=\"draft-status muted\" id=\"draft-status\" aria-live=\"polite\"></div>",
          "  <div class=\"actions-confirm\">",
          "    <p class=\"signature-label\"><strong>Assinatura (obrigatória só na confirmação final) *</strong></p>",
          "    <canvas id=\"signatureCanvas\" width=\"500\" height=\"120\"></canvas>",
          "    <p class=\"muted\" style=\"margin-top:0.25rem\">Desenhe no quadro acima. O rascunho pode salvar a assinatura se você já desenhou.</p>",
          "    <button type=\"button\" class=\"secondary\" id=\"clearSig\">Limpar assinatura</button>",
          "    <div id=\"formMessage\"></div>",
          "    <button type=\"submit\" id=\"submitBtn\">Confirmar e enviar FNRH</button>",
          "  </div>",
          "</form>",
          "</div>"
        ].join("");

        var form = document.getElementById("fnrh-form");
        var draftEl = document.getElementById("draft-status");
        var canvas = document.getElementById("signatureCanvas");
        var ctx = canvas.getContext("2d");
        var drawing = false;
        var draftTimer = null;
        var draftAbort = null;

        function getPos(e) {
          var rect = canvas.getBoundingClientRect();
          var scaleX = canvas.width / rect.width;
          var scaleY = canvas.height / rect.height;
          var ev = e.touches ? e.touches[0] : e;
          return { x: (ev.clientX - rect.left) * scaleX, y: (ev.clientY - rect.top) * scaleY };
        }
        canvas.addEventListener("mousedown", function (e) { drawing = true; var p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); scheduleDraftSoon(); });
        canvas.addEventListener("mousemove", function (e) { if (!drawing) return; var p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); scheduleDraftSoon(); });
        canvas.addEventListener("mouseup", function () { drawing = false; scheduleDraftSoon(); });
        canvas.addEventListener("mouseleave", function () { drawing = false; });
        canvas.addEventListener("touchstart", function (e) { e.preventDefault(); drawing = true; var p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); scheduleDraftSoon(); }, { passive: false });
        canvas.addEventListener("touchmove", function (e) { e.preventDefault(); if (!drawing) return; var p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); scheduleDraftSoon(); }, { passive: false });
        canvas.addEventListener("touchend", function () { drawing = false; scheduleDraftSoon(); });

        document.getElementById("clearSig").addEventListener("click", function () {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          scheduleDraftSoon();
        });

        if (data.assinatura_base64 && String(data.assinatura_base64).indexOf("data:image") === 0) {
          var img = new Image();
          img.onload = function () {
            try {
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            } catch (_) {}
          };
          img.src = data.assinatura_base64;
        }

        function canvasHasInk() {
          try {
            var id = ctx.getImageData(0, 0, canvas.width, canvas.height);
            for (var i = 0; i < id.data.length; i += 4) {
              if (id.data[i + 3] > 0) return true;
            }
          } catch (_) { return true; }
          return false;
        }

        function buildDraftBody() {
          var fd = new FormData(form);
          var body = {
            hospede_id: guestId,
            token: token,
            action: "draft",
            flow_version: "legacy",
            hospede_nome: fd.get("hospede_nome") || "",
            documento: fd.get("documento") || "",
            data_nascimento: fd.get("data_nascimento") || null,
            nacionalidade: fd.get("nacionalidade") || "",
            endereco: fd.get("endereco") || "",
            telefone: fd.get("telefone") || "",
            email: fd.get("email") || "",
            procedencia: fd.get("procedencia") || "",
            destino: fd.get("destino") || "",
            placa_veiculo: fd.get("placa_veiculo") || "",
            cor_veiculo: fd.get("cor_veiculo") || "",
            modelo_veiculo: fd.get("modelo_veiculo") || ""
          };
          if (canvasHasInk()) body.assinatura_base64 = canvas.toDataURL("image/png");
          return body;
        }

        function doDraft() {
          if (draftAbort) draftAbort.abort();
          draftAbort = new AbortController();
          fetch(getSubmitUrl(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(buildDraftBody()),
            signal: draftAbort.signal
          })
            .then(function (r) { return r.json(); })
            .then(function (res) {
              if (res.ok) {
                draftEl.textContent = "Rascunho salvo automaticamente às " + formatTime(new Date()) + ".";
                draftEl.className = "draft-status is-ok";
              } else {
                draftEl.textContent = res.error || "Não foi possível salvar o rascunho.";
                draftEl.className = "draft-status is-err";
              }
            })
            .catch(function (e) {
              if (e.name === "AbortError") return;
              draftEl.textContent = "Erro de rede ao salvar rascunho.";
              draftEl.className = "draft-status is-err";
            });
        }

        function scheduleDraftSoon() {
          if (draftTimer) clearTimeout(draftTimer);
          draftTimer = setTimeout(doDraft, DEBOUNCE_MS);
        }

        form.querySelectorAll("[data-draft]").forEach(function (el) {
          el.addEventListener("input", scheduleDraftSoon);
          el.addEventListener("blur", function () {
            if (draftTimer) clearTimeout(draftTimer);
            doDraft();
          });
        });

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var msgEl = document.getElementById("formMessage");
          var btn = document.getElementById("submitBtn");
          var fd = new FormData(form);
          var hospede_nome = (fd.get("hospede_nome") || "").toString().trim();
          var documento = (fd.get("documento") || "").toString().trim();
          var nacionalidade = (fd.get("nacionalidade") || "").toString().trim();
          var endereco = (fd.get("endereco") || "").toString().trim();
          var telefone = (fd.get("telefone") || "").toString().trim();
          var email = (fd.get("email") || "").toString().trim();
          var procedencia = (fd.get("procedencia") || "").toString().trim();
          var destino = (fd.get("destino") || "").toString().trim();
          if (!hospede_nome || !documento || !nacionalidade || !endereco || !telefone || !email || !procedencia || !destino) {
            msgEl.innerHTML = "<p class=\"error\">Preencha todos os campos obrigatórios antes de confirmar.</p>";
            return;
          }
          if (!canvasHasInk()) {
            msgEl.innerHTML = "<p class=\"error\">Desenhe sua assinatura para confirmar.</p>";
            return;
          }
          var body = {
            hospede_id: guestId,
            token: token,
            action: "confirm",
            flow_version: "legacy",
            hospede_nome: hospede_nome,
            documento: documento,
            data_nascimento: fd.get("data_nascimento") || null,
            nacionalidade: nacionalidade,
            endereco: endereco,
            telefone: telefone,
            email: email,
            procedencia: procedencia,
            destino: destino,
            placa_veiculo: fd.get("placa_veiculo") || "",
            cor_veiculo: fd.get("cor_veiculo") || "",
            modelo_veiculo: fd.get("modelo_veiculo") || "",
            assinatura_base64: canvas.toDataURL("image/png")
          };
          btn.disabled = true;
          msgEl.innerHTML = "";
          fetch(getSubmitUrl(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          })
            .then(function (r) { return r.json(); })
            .then(function (res) {
              if (res.ok) {
                app.innerHTML = '<div class="legacy-wrap"><h1>FNRH</h1><p class="success">' + escapeHtml(res.message || "FNRH confirmada.") + "</p></div>";
              } else {
                msgEl.innerHTML = "<p class=\"error\">" + escapeHtml(res.error || "Falha ao confirmar.") + "</p>";
                btn.disabled = false;
              }
            })
            .catch(function () {
              msgEl.innerHTML = "<p class=\"error\">Erro de conexão. Tente novamente.</p>";
              btn.disabled = false;
            });
        });

        setTimeout(doDraft, 400);
      }
    })();
  </script>
</body>
</html>
