<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yes Hotel — Geolocalização do hotel</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./checkin-operacional-mvp.css?v=54" />
    <style>
      .geo-page { max-width: 640px; margin: 0 auto; padding: 1.25rem; }
      .geo-page h1 { font-size: 1.35rem; margin: 0 0 0.35rem; }
      .geo-page .lead { color: #555; margin: 0 0 1rem; font-size: 0.95rem; }
      .geo-form { display: grid; gap: 0.75rem; background: #fff; border: 1px solid #dce4e4; border-radius: 14px; padding: 1.1rem; }
      .geo-form label { display: grid; gap: 0.3rem; font-size: 0.85rem; min-width: 0; }
      .geo-form input { width: 100%; max-width: 100%; min-height: 2.4rem; border: 1px solid #dce4e4; border-radius: 8px; padding: 0.4rem 0.55rem; }
      .geo-form .form-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.25rem; }
      .geo-msg { margin-top: 0.75rem; font-size: 0.9rem; }
      .geo-msg.ok { color: #0a7a32; }
      .geo-msg.err { color: #b42318; }
      @media (min-width: 641px) {
        .geo-form { grid-template-columns: 1fr 1fr; }
        .geo-form .span-2 { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body class="op-body checkin-view">
    <div id="access-state" class="op-access hidden" aria-live="polite"></div>
    <div id="content-panel" class="op-app hidden">
      <aside class="yes-sidebar" aria-label="Áreas operacionais">
        <div class="yes-sidebar-brand">
          <img src="./assets/yes-hotel-logo.png" alt="Yes Hotel" width="153" height="89" />
        </div>
        <nav aria-label="Navegação principal">
          <span class="yes-sidebar-label">Áreas operacionais</span>
          <a href="./usuarios-login-mvp.html"><span>Início</span></a>
          <a href="./checkin-operacional-mvp.html"><span>Operação</span></a>
          <a href="./cafe-da-manha-mvp.html"><span>Café da manhã</span></a>
          <a href="./demandas-mvp.html?escopo=minhas" data-nav="minhas-demandas"><span>Minhas demandas</span></a>
          <a href="./demandas-mvp.html" data-nav="demandas"><span>Demandas</span></a>
          <a href="./gestao-saude-hotel.html" data-nav="gestao"><span>Gestão</span></a>
          <a href="./financeiro-conciliacao.html" data-nav="financeiro"><span>Conciliação</span></a>
        </nav>
      </aside>
      <div class="yes-workspace">
        <main class="geo-page">
          <h1>Geolocalização do hotel</h1>
          <p class="lead">
            Usado para validar presença em ações com localização obrigatória.
            Somente admin. O raio inicial é 200 metros. Sem configuração, ações com
            localização obrigatória ficam bloqueadas.
          </p>
          <form id="geo-form" class="geo-form">
            <label>Latitude <input name="latitude" type="number" step="any" required /></label>
            <label>Longitude <input name="longitude" type="number" step="any" required /></label>
            <label class="span-2">Raio em metros <input name="raio" type="number" min="1" value="200" required /></label>
            <div class="span-2 form-actions">
              <button type="submit" class="op-btn op-btn--primary">Salvar coordenadas</button>
            </div>
          </form>
          <p id="geo-msg" class="geo-msg" role="status"></p>
        </main>
      </div>
    </div>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="./yes-supabase-config.js"></script>
    <script defer src="./yes-supabase-auth.js"></script>
    <script defer src="./geolocalizacao-hotel-mvp.js"></script>
  </body>
</html>
