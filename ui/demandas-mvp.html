<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yes Hotel — Demandas</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./checkin-operacional-mvp.css?v=53" />
    <link rel="stylesheet" href="./demandas-mvp.css?v=5" />
  </head>
  <body class="op-body checkin-view demandas-view">
    <div id="access-state" class="op-access hidden" aria-live="polite"></div>

    <div id="content-panel" class="op-app hidden">
      <aside class="yes-sidebar" id="demandas-sidebar" aria-label="Áreas operacionais">
        <div class="yes-sidebar-brand">
          <img src="./assets/yes-hotel-logo.png" alt="Yes Hotel" width="153" height="89" />
          <button
            type="button"
            class="op-icon-button yes-sidebar-close"
            id="demandas-sidebar-close"
            aria-label="Fechar menu"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
          </button>
        </div>
        <nav aria-label="Navegação principal">
          <span class="yes-sidebar-label">Áreas operacionais</span>
          <a href="./usuarios-login-mvp.html">
            <span>Início</span>
          </a>
          <a href="./checkin-operacional-mvp.html" data-nav="operacao">
            <span>Operação</span>
          </a>
          <a href="./cafe-da-manha-mvp.html" data-nav="cafe">
            <span>Café da manhã</span>
          </a>
          <a href="./gestao-saude-hotel.html" data-nav="gestao">
            <span>Gestão</span>
          </a>
          <a href="./financeiro-conciliacao.html" data-nav="financeiro">
            <span>Conciliação</span>
          </a>
          <a href="./demandas-mvp.html?escopo=minhas" data-nav="minhas-demandas" id="nav-minhas">
            <span>Minhas demandas</span>
          </a>
          <a class="active" href="./demandas-mvp.html" data-nav="demandas" id="nav-todas" aria-current="page">
            <span>Demandas</span>
          </a>
        </nav>
        <div class="yes-sidebar-foot">
          Manutenção predial<br />
          <strong>Ciclo manual · etapa 1</strong>
        </div>
      </aside>

      <button
        type="button"
        class="op-sidebar-backdrop"
        id="demandas-sidebar-backdrop"
        aria-label="Fechar navegação"
        tabindex="-1"
      ></button>

      <div class="yes-workspace">
        <header class="op-header">
          <div class="op-header__left">
            <button
              type="button"
              class="op-icon-button op-menu-toggle"
              id="demandas-menu-toggle"
              aria-label="Abrir menu"
              aria-controls="demandas-sidebar"
              aria-expanded="false"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
            <img
              class="op-header-logo"
              src="./assets/yes-hotel-logo.png"
              alt="Yes Hotel"
              width="153"
              height="89"
            />
            <div class="op-header__heading">
              <span class="op-header__eyebrow">Manutenção predial</span>
              <h1 class="op-header__title" id="demandas-page-title">Demandas</h1>
            </div>
          </div>
          <div class="op-header__right">
            <p id="session-user" class="op-header__user" aria-live="polite">
              <strong id="demandas-session-user-name"></strong>
              <span id="demandas-session-user-role" class="op-header__role"></span>
            </p>
            <button type="button" class="op-btn op-btn--ghost" id="logout-button">
              <span>Sair</span>
            </button>
          </div>
        </header>

        <main class="op-content demandas-content">
          <p id="demandas-notice" class="demandas-notice hidden" role="status"></p>

          <section class="demandas-kpis" aria-label="Resumo">
            <article><span>Total</span><strong id="kpi-total">0</strong></article>
            <article><span>Em andamento</span><strong id="kpi-andamento">0</strong></article>
            <article><span>Aguardando validação</span><strong id="kpi-validacao">0</strong></article>
            <article><span>Vencidas</span><strong id="kpi-vencidas">0</strong></article>
          </section>

          <section class="demandas-toolbar">
            <div class="demandas-filters">
              <label>
                Tipo
                <select id="filter-tipo">
                  <option value="">Todos</option>
                  <option value="corretiva">Corretiva</option>
                  <option value="programada">Programada</option>
                </select>
              </label>
              <label>
                Prioridade
                <select id="filter-prioridade">
                  <option value="">Todas</option>
                  <option value="baixa">Baixa</option>
                  <option value="media">Média</option>
                  <option value="alta">Alta</option>
                </select>
              </label>
              <label>
                Status
                <select id="filter-status">
                  <option value="">Todos</option>
                  <option value="agendada">Agendada</option>
                  <option value="nao_iniciada">Não iniciada</option>
                  <option value="em_andamento">Em andamento</option>
                  <option value="pausada">Pausada</option>
                  <option value="aguardando_validacao">Aguardando validação</option>
                  <option value="em_correcao">Em correção</option>
                  <option value="concluida">Concluída</option>
                  <option value="cancelada">Cancelada</option>
                </select>
              </label>
              <label>
                Atraso
                <select id="filter-atraso">
                  <option value="">Todas</option>
                  <option value="vencida">Somente vencidas</option>
                  <option value="no_prazo">No prazo</option>
                </select>
              </label>
            </div>
            <button type="button" class="op-btn op-btn--primary" id="btn-nova">Nova demanda</button>
          </section>

          <section id="create-panel" class="demandas-panel hidden">
            <h2 id="create-panel-title">Criar demanda</h2>
            <form id="create-form" class="demandas-form-grid">
              <label class="span-2">Título <input name="titulo" required maxlength="180" /></label>
              <label class="span-2">
                Descrição (inclua o local afetado)
                <textarea name="descricao" required rows="3"></textarea>
              </label>
              <label>
                Tipo
                <select name="tipo" required>
                  <option value="corretiva">Corretiva</option>
                  <option value="programada">Programada</option>
                </select>
              </label>
              <label>
                Prioridade
                <select name="prioridade" required>
                  <option value="media">Média</option>
                  <option value="baixa">Baixa</option>
                  <option value="alta">Alta</option>
                </select>
              </label>
              <label>
                Data programada para início
                <input name="data_programada_inicio" type="date" required />
              </label>
              <label>
                Data prevista de conclusão
                <input name="data_prevista_conclusao" type="date" required />
              </label>
              <label>
                Supervisor
                <select name="supervisor_id" required></select>
              </label>
              <label>
                Executor
                <select name="executor_id" required></select>
              </label>
              <label class="checkbox-line">
                <input type="checkbox" name="exigir_foto" /> Exigir foto
              </label>
              <label class="checkbox-line">
                <input type="checkbox" name="sem_local_especifico" /> Sem local específico
              </label>
              <div class="span-2 form-actions">
                <button type="submit" id="create-submit-btn" class="op-btn op-btn--primary">Criar</button>
                <button type="button" class="op-btn op-btn--ghost" id="btn-cancelar-criar">Cancelar</button>
              </div>
            </form>
          </section>

          <section class="demandas-list-section" aria-labelledby="demandas-list-heading">
            <h2 class="demandas-list-title" id="demandas-list-heading">Todas as demandas</h2>
            <div id="demandas-list" class="demandas-list"></div>
          </section>

          <section id="detail-panel" class="demandas-panel hidden">
            <h2 id="detail-title">Detalhe</h2>
            <div id="detail-body"></div>
            <section class="demandas-detail-block" aria-label="Ações">
              <h3>Ações</h3>
              <div id="detail-actions" class="demandas-actions"></div>
            </section>
            <section class="demandas-detail-block" aria-label="Fotos">
              <h3>Fotos</h3>
              <div class="demandas-photo-row">
                <label class="demandas-camera-btn">
                  <input
                    id="photo-input-camera"
                    type="file"
                    accept="image/*"
                    capture="environment"
                  />
                  <span aria-hidden="true">📷</span>
                  Tirar foto
                </label>
                <label class="demandas-camera-btn demandas-camera-btn--gallery">
                  <input
                    id="photo-input-gallery"
                    type="file"
                    accept="image/*"
                  />
                  Escolher da galeria
                </label>
                <select id="photo-etapa" aria-label="Etapa da foto">
                  <option value="antes">Antes</option>
                  <option value="durante" selected>Durante</option>
                  <option value="finalizacao">Finalização</option>
                  <option value="correcao">Correção</option>
                </select>
              </div>
              <div id="photo-list" class="demandas-photo-list"></div>
            </section>
            <section class="demandas-detail-block" aria-label="Histórico">
              <h3>Histórico</h3>
              <ol id="historico-list" class="demandas-historico"></ol>
            </section>
          </section>
        </main>
      </div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="./yes-supabase-config.js"></script>
    <script defer src="./yes-supabase-auth.js?v=4"></script>
    <script defer src="./yes-demandas-photo.js?v=1"></script>
    <script defer src="./demandas-render.js?v=4"></script>
    <script defer src="./demandas-mvp.js?v=6"></script>
  </body>
</html>
