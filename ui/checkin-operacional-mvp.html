<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yes Hotel - Painel de Check-in Operacional</title>
    <link rel="stylesheet" href="./checkin-operacional-mvp.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <p class="eyebrow">Yes Hotel</p>
        <h1>Painel de Check-in Operacional</h1>
        <p class="page-description">
          Acompanhamento por reserva: pagamento, FNRH, acesso e entrada no apartamento.
        </p>
      </header>

      <section class="access-state hidden" id="access-state"></section>

      <section class="panel hidden" id="content-panel">
        <div class="session-bar">
          <div id="session-user"></div>
          <div class="session-actions">
            <a class="secondary-link" href="./recepcao-mvp.html">Voltar para recepcao</a>
            <button class="secondary-button" id="logout-button" type="button">Sair</button>
          </div>
        </div>

        <div class="summary-cards" id="summary-cards"></div>

        <div class="filter-bar" id="filter-bar"></div>

        <section class="lista-operacional" id="lista-operacional" aria-live="polite"></section>

        <aside class="reservation-detail-panel hidden" id="reservation-detail-panel" aria-label="Detalhe da reserva">
          <div class="reservation-detail-header">
            <h2 class="reservation-detail-title" id="reservation-detail-title">Reserva</h2>
            <button type="button" class="reservation-detail-close" id="reservation-detail-close" aria-label="Fechar">Fechar</button>
          </div>
          <div class="reservation-detail-body" id="reservation-detail-body"></div>
        </aside>
        <div class="reservation-detail-backdrop hidden" id="reservation-detail-backdrop" aria-hidden="true"></div>

        <div class="modal-overlay hidden" id="modal-enviar-senha-overlay" aria-hidden="true">
          <div class="modal-enviar-senha" role="dialog" aria-labelledby="modal-enviar-senha-title">
            <h3 id="modal-enviar-senha-title">Enviar senha de acesso</h3>
            <p class="modal-enviar-senha-desc">Informe pelo menos um contato (e-mail ou WhatsApp) para envio da senha e dos links da FNRH.</p>
            <form id="modal-enviar-senha-form">
              <label for="modal-enviar-senha-email">E-mail</label>
              <input type="email" id="modal-enviar-senha-email" name="email" placeholder="exemplo@email.com" />
              <label for="modal-enviar-senha-whatsapp">WhatsApp</label>
              <input type="tel" id="modal-enviar-senha-whatsapp" name="whatsapp" placeholder="(00) 00000-0000" />
              <div class="modal-enviar-senha-actions">
                <button type="button" class="secondary-button" id="modal-enviar-senha-cancel">Cancelar</button>
                <button type="submit" class="primary-button" id="modal-enviar-senha-submit">Enviar senha</button>
              </div>
            </form>
            <p class="modal-enviar-senha-msg hidden" id="modal-enviar-senha-msg"></p>
          </div>
        </div>
      </section>
    </main>

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="./yes-supabase-config.js"></script>
    <script defer src="./yes-supabase-auth.js"></script>
    <script defer src="./checkin-operacional-mvp.js?v=3"></script>
  </body>
</html>
